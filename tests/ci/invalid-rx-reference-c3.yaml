# Must be REJECTED: rx_reference_pin needs MCPWM, which the C3 lacks
esphome:
  name: ci-invalid-rx-ref
esp32:
  variant: esp32c3
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: ../../components
logger:
api:
ethernet:
  type: W5500
  clk_pin: GPIO7
  mosi_pin: GPIO6
  miso_pin: GPIO5
  cs_pin: GPIO10
  interrupt_pin: GPIO3
  reset_pin: GPIO1
uart:
  id: gnss_uart
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 9600
pps_ntp:
  uart_id: gnss_uart
  pps_pin: GPIO4
  rx_reference_pin: 3
