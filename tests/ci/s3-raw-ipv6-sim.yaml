# ESP32-S3: raw lwIP transport, IPv6, and the gnss_sim emulator looped back on the same pins
esphome:
  name: ci-s3-raw
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: ../../components
logger:
api:
network:
  enable_ipv6: true
ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
uart:
  id: gnss_uart
  rx_pin: GPIO17
  tx_pin: GPIO16
  baud_rate: 9600
pps_ntp:
  uart_id: gnss_uart
  pps_pin: GPIO15
  transport: raw_lwip
  synced: {name: GPS Synced}
gnss_sim:
  id: sim
  pps_pin: 15
  tx_pin: 17
  rx_pin: 16
  ppm: 12
button:
  - platform: template
    name: Sim Leap
    on_press: [lambda: 'id(sim).arm_leap(120);']
